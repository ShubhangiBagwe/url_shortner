<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
</head>

<body>
    <div class="container">
        <h2>URL Shortener</h2>
        <form id="shorten-form">
            <div>
                <label for="url">Enter URL:</label>
                <input type="url" name="url" id="url" required />
            </div>
            <div>
                <label for="shortCode">Enter shortCode:</label>
                <input type="text" name="shortCode" id="shortCode" required />
            </div>
            <button type="">Submit</button>
        </form>

        <h1>Shortened URL</h1>
        <ul id="shortener-urls"></ul>

    </div>
    <script>

        const fetchShortendURL = async () => {
            const response = await fetch('/links');
            const links = await response.json()
            console.log(links)

            const list = document.getElementById('shortener-urls')
            list.innerHTML = ""

            for (const [shortCode, url] of Object.entries(links)) {
                const li = document.createElement('li')
                const truncatedURL = url.length >= 30 ? `${url.slice(0,30)}...` : url
                li.innerHTML = `<a href="/${shortCode}" target="_blank">${window.location.origin}/${shortCode}</a> - ${truncatedURL}`
                list.appendChild(li)
            }
        }
        document.getElementById('shorten-form')
            .addEventListener('submit', async (event) => {
                event.preventDefault();

                const formData = new FormData(event.target)
                const url = formData.get("url")
                const shortCode = formData.get("shortCode")
                // console.log(url, shortCode)

                try {
                    const response = await fetch("/shorten", {
                        method: "POST",
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ url, shortCode })
                    });

                    // console.log(response,'resss')
                    if (response.ok) {
                        fetchShortendURL()
                        alert('Form submited Successfully')
                        event.target.reset()
                    } else {
                        const errorMsg = await response.text()
                        alert(errorMsg)
                    }

                } catch (error) {
                    console.log(error)
                }
            })
        fetchShortendURL()
    </script>
</body>

</html>
